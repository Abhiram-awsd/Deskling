[package]
name = "deskling"
version = "0.1.0"
description = "A tiny desktop figurine that keeps you focused."
license = "MIT"
edition = "2021"

[lib]
name = "deskling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"

# small binary, low memory
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
